# =========================
# WAF Development Config
# =========================

# Listener
listen_port=3333

# Backend application
backend_host=127.0.0.1
backend_port=8000

# Rules
rules_file=../rules/disabled/experimental.rules
block_threshold=100

# Built-in DFA modules
enable_sql_dfa=1
enable_xss_dfa=1

# Logging
log_file=../logs/waf.log
log_allow=1

# Limits
max_request_size=8192
max_body_size=8192
max_headers=100
